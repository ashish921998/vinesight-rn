title = "vinesight-rn gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and local-only directories are not repository secret sources"
paths = [
  '''^\.git/''',
  '''^\.claude/''',
  '''^\.gstack/''',
  '''^android/app/build/''',
  '''^android/\.gradle/''',
  '''^ios/Pods/''',
  '''^ios/build/''',
  '''^node_modules/''',
  '''^dist/'''
]

[[allowlists]]
description = "Irrigation discharge field names are false positives, not API keys"
regexes = [
  '''dischargePerHour[12]'''
]
