# Smoke test: from a clean install, sign in and verify the dashboard renders.
# Self-contained — clears app state and logs in with the e2e test account.
appId: com.vinesight.ios
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: subflows/login.yml
# App defaults to Simplified mode: Home + Farms tabs only, action-forward home.
# Workers/Tasks/Activities are intentionally hidden here.
- assertVisible: 'Record Purchase'
- assertVisible: 'Recent Records'
- assertVisible: 'Farms'
