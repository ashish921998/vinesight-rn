name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, Widgets, Lint, Web Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run tsc

      - name: Widget tests
        run: npm run test:widgets

      - name: Lint
        run: npm run lint

      - name: Web export smoke check
        run: npm run web:smoke
